services:
  postgres:
    image: postgres:16-alpine
    container_name: smartkit-postgres
    ports:
      - "5433:5432"
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartkit
    volumes:
      - smartkit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartkit"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  smartkit_pgdata:
